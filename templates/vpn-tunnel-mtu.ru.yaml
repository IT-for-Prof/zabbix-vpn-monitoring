            and min(/VPN Tunnel MTU by Zabbix agent RU/vpn.pmtu[{#VPN_IFACE},{#VPN_TARGET},{#VPN_TECH}],{$VPN.HYST.WINDOW})>0
            and count(/VPN Tunnel MTU by Zabbix agent RU/vpn.pmtu[{#VPN_IFACE},{#VPN_TARGET},{#VPN_TECH}],{$VPN.HYST.WINDOW})>1
          name: 'VPN {#VPN_TECH} {#VPN_IFACE}->{#VPN_TARGET}: потеря крупных пакетов из-за MTU'
          opdata: разница {ITEM.LASTVALUE} B
