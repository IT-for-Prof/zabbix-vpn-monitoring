            and count(/VPN Tunnel MTU by Zabbix agent RU/vpn.pmtu[{#VPN_IFACE},{#VPN_TARGET},{#VPN_TECH}],{$VPN.HYST.WINDOW})>1
          name: 'VPN {#VPN_TECH} {#VPN_IFACE}->{#VPN_TARGET}: цель проверки недоступна'
          status: DISABLED
          priority: AVERAGE
          description: Только данные, триггер отключён. Оповещения о доступности не отправляются из-за
