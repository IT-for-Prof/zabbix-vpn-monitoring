    tags:
    - tag: class
      value: network
    - tag: component
      value: vpn
    macros:
    - macro: '{$VPN.DYNAMIC.PAGING}'
      value: '1'
      description: Переключатель оповещений для отдельных целей с контекстом по макросу LLD {#VPN_DYNAMIC}.
        Статические цели OpenVPN Community используют 0 и вызывают оповещения; перемещающиеся клиенты
        Access Server используют 1 и сохраняются только как данные. Возвращайте контекстное значение в
        1, только если оповещения PMTU для динамических клиентов нужны в эксплуатации.
    - macro: '{$VPN.DYNAMIC.PAGING:"1"}'
      value: '0'
      description: Контекст по умолчанию отключает оповещения для динамических клиентов Access Server
        и сохраняет историю метрик и тег событий vpn_dynamic=1.
    - macro: '{$VPN.MTU.MAX}'
      value: '1420'
      description: Безопасный предел MTU для туннелей WireGuard поверх интернета/Xray. Проверка конфигурации
        оповещает с уровнем «Предупреждение» при превышении MTU интерфейса. Переопределите значение на
        хосте/в контексте, если туннелю нужен меньший MTU, например 1340 на промежуточном хосте. Асимметрия
        ниже порога, например 1400 там, где требуется 1340, не обнаруживается; для неё нужно сравнивать
        хосты.
    - macro: '{$VPN.WATCHDOG.WINDOW}'
      value: 30m
      description: Окно отсутствия данных для контроля потери мониторинга. Если wg.count с интервалом
        1m не поступает в течение этого времени, доставка через активные проверки Agent2/UserParameter
        считается неисправной, а зависимые события туннелей и конфигурации подавляются. Значение 0 допустимо
        на хостах без wg/awg, поэтому этот контроль работает и на хостах только с OpenVPN/ZeroTier. Он
        не проверяет их ключи обнаружения или PMTU. Режим nodata по умолчанию учитывает доступность прокси;
        её нужно контролировать отдельно. Макрос используется в триггере контроля доставки и всех зависимостях
        от него. Увеличивайте значение на хосте, только если этого требует его фактический интервал активных
        проверок.
    - macro: '{$VPN.AGENT.WINDOW}'
      value: 15m
      description: 'Окно отсутствия данных для контроля доступности агента (agent.variant, 1m). После
        этого времени весь канал активных проверок считается недоступным, а «VPN: нет данных мониторинга»
        подавляется. За общую потерю связи отвечает собственное оповещение хоста о доступности агента.
        Окно должно быть короче {$VPN.WATCHDOG.WINDOW}, чтобы родитель успел перейти в PROBLEM до срабатывания
        дочернего триггера. Зависимости Zabbix не подавляют уже открытое событие. Значение по умолчанию
        15m вдвое меньше 30m у контроля доставки. Увеличивайте оба окна вместе.'
    - macro: '{$VPN.HYST.WINDOW}'
      value: 25m
      description: 'Окно гистерезиса. Триггер срабатывает, только если все значения в окне подтверждают
        проблему и получено не меньше двух значений: каждое защищённое выражение содержит `count(...)>1`.
        Ограничение числа значений необходимо, поскольку окно задаёт время, а не количество записей. После
        перерыва сбора длиннее окна в нём остаётся одно новое значение, и min()/max() без ограничения
        сработали бы по одному ошибочному чтению. Контроль wg.count этого не обнаружит, если остановилась
        только одна метрика, а wg.count продолжает поступать.


        Известное ограничение, проверенное на рабочем сервере: count() считает значения, а не опросы.
        Если хост дублирует записи, один опрос уже удовлетворяет >1. Поэтому после перерыва длиннее окна
        один опрос с дублирующей записью всё ещё может вызвать оповещение. Для этого должны совпасть оба
        условия; поведение не хуже, чем у проверки числа значений до версии 1.2.0 на тех же хостах. Для
        устранения ограничения потребовался бы подсчёт уникальных временных меток, которого нет в функциях
        триггеров Zabbix.


        Окно задано временем, а не числом записей (#N). При двойной записи значения за опрос, например
        при proxy-group или двух ServerActive, #2 охватывает один опрос и отключает гистерезис. Временное
        окно от дублирования не сокращается. Держите его длиннее удвоенного наибольшего интервала защищённых
        метрик: {$VPN.PROBE.INTERVAL} и фиксированных 10m для конфигурации. Значение по умолчанию 25m
        покрывает оба интервала. Общий контроль проверки wg.probe.ok с интервалом 5m также требует полного
        окна, поэтому потеря cap_net_raw подтверждается примерно за 25m вместо 10m, раньше {$VPN.WATCHDOG.WINDOW}.'
    - macro: '{$VPN.PROBE.INTERVAL}'
      value: 10m
      description: 'Интервал активных проверок PMTU отдельных туннелей (wg.pmtu/vpn.pmtu). Каждая проверка
        дважды читает `wg show` через NOPASSWD sudo, не получая ключи. Ошибка MTU определяется устойчивой
        конфигурацией, поэтому интервала 10m достаточно. По сравнению с прежними 5m число вызовов sudo
        агентом уменьшается примерно вдвое; средства безопасности хоста могут оповещать о числе вызовов
        sudo служебной учётной записью. Уменьшайте интервал, если нужно быстрее обнаруживать проблему
        MTU. При увеличении интервала на хосте увеличьте и {$VPN.HYST.WINDOW} на том же хосте как минимум
        вдвое относительно нового интервала. При интервале >12m30s окно 25m оставляет одно значение и
        отключает гистерезис, от чего защищает {$VPN.HYST.WINDOW}. Статическая проверка этого не обнаружит:
        тест видит значения шаблона по умолчанию, но не переопределения на хостах.'
    - macro: '{$VPN.PROBE.NODATA}'
      value: 45m
      description: Окно отсутствия данных PMTU отдельной цели. Оно должно быть длиннее {$VPN.WATCHDOG.WINDOW}+{$VPN.PROBE.INTERVAL}.
        Значение по умолчанию 45m даёт общему контролю доставки с окном 30m время сформировать единственную
        родительскую проблему до события потери данных дочерней проверки. Отключённые цели и цели без
        ICMP продолжают возвращать -2/-1, поэтому этот контроль на них не срабатывает. Режим nodata по
        умолчанию учитывает доступность прокси и предотвращает множество событий после его отказа. Увеличивайте
        макрос вместе с увеличением окна контроля доставки или интервала проверки.
    - macro: '{$VPN.PROBE.TARGETS}'
      description: Переопределения целей проверки по интерфейсам для туннелей OpenVPN/ZeroTier. Список
        iface=ip через запятую, например "ztr4nqvec7=192.168.192.5,tun0=10.8.0.1". Передаётся в ключи
        LLD обнаружения соответствующей технологии. Имена интерфейсов уникальны между технологиями.
    - macro: '{$WG.PROBE.TARGETS}'
      description: Переопределения целей проверки по интерфейсам для туннелей без маршрута /32 (подсеть/0.0.0.0/0).
        Список iface=ip через запятую, например "wg0=192.0.2.3,wgX=10.0.0.1". Передаётся в ключ LLD wg.discovery.
        Интерфейс без маршрута /32 и без переопределения остаётся без проверки, чтобы не создавать ложное
        событие.
    valuemaps:
    - uuid: c53cc0d777ac4ac1ac48cbdca0576b10
      name: Флаг конфигурации VPN
      mappings:
      - value: '0'
        newvalue: нет
      - value: '1'
        newvalue: да
    - uuid: d34b2df630f64df5ae916134722d1da3
      name: Работоспособность проверки PMTU
      mappings:
      - value: '0'
        newvalue: неисправна (общая проверка недоступна)
      - value: '1'
        newvalue: исправна
    - uuid: 2b5e123be2284c06b9cdc103e8e49315
      name: Состояние проверки PMTU VPN
      mappings:
      - value: '-2'
        newvalue: отключён (нет handshake)
      - value: '-1'
        newvalue: недоступен (туннель работает, ICMP не отвечает)
      - value: '0'
        newvalue: исправен (разницы MTU нет)
