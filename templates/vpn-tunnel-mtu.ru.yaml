            MTU by Zabbix agent RU/wg.probe.ok,{$VPN.HYST.WINDOW})=1 and nodata(/VPN Tunnel MTU by Zabbix
            agent RU/vpn.pmtu[{#VPN_IFACE},{#VPN_TARGET},{#VPN_TECH}],{$VPN.PROBE.NODATA})=1
          name: 'VPN {#VPN_TECH} {#VPN_IFACE}->{#VPN_TARGET}: нет данных PMTU на {HOST.NAME}'
          priority: WARNING
          description: Метрика PMTU этой цели не поступает в течение {$VPN.PROBE.NODATA}. Отключённые
            цели и цели, которые не отвечают на ICMP, продолжают возвращать -2/-1, поэтому событие означает
