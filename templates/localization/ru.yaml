    для динамических клиентов нужны в эксплуатации.
  ? 'Default context: suppress paging for dynamic Access Server clients while retaining item history and
    the vpn_dynamic=1 event tag.'
  : Контекст по умолчанию отключает оповещения для динамических клиентов Access Server и сохраняет историю
    метрик и тег событий vpn_dynamic=1.
  ? Safe MTU ceiling for WireGuard tunnels over an internet/Xray underlay. The posture check pages (Warning)
    when an iface MTU exceeds this. Override per host/context where a tunnel needs a lower value (e.g.
    a relay host -> 1340). Sub-ceiling asymmetry (1400 where 1340 is needed) is out of scope — needs cross-host
    comparison.
  : Безопасный предел MTU для туннелей WireGuard поверх интернета/Xray. Проверка конфигурации оповещает
    с уровнем «Предупреждение» при превышении MTU интерфейса. Переопределите значение на хосте/в контексте,
    если туннелю нужен меньший MTU, например 1340 на промежуточном хосте. Асимметрия ниже порога, например
    1400 там, где требуется 1340, не обнаруживается; для неё нужно сравнивать хосты.
  ? 'No-data window for the monitoring-blind watchdog: if the 1m wg.count heartbeat yields nothing for
    this long, delivery through that Agent2 active-check/UserParameter path is assumed broken and dependent
    tunnel/posture alerts are suppressed. The value 0 is valid on hosts without wg/awg, so the delivery
    heartbeat also works on OpenVPN/ZeroTier-only hosts; it is not a healthcheck for their discovery or
    probe keys. Default nodata mode is proxy-aware; monitor proxy availability separately. Referenced
    by the watchdog trigger and every dependency on it. Override per host only when its effective active-check
    cadence requires a longer window.'
  : Окно отсутствия данных для контроля потери мониторинга. Если wg.count с интервалом 1m не поступает
    в течение этого времени, доставка через активные проверки Agent2/UserParameter считается неисправной,
    а зависимые события туннелей и конфигурации подавляются. Значение 0 допустимо на хостах без wg/awg,
    поэтому этот контроль работает и на хостах только с OpenVPN/ZeroTier. Он не проверяет их ключи обнаружения
    или PMTU. Режим nodata по умолчанию учитывает доступность прокси; её нужно контролировать отдельно.
    Макрос используется в триггере контроля доставки и всех зависимостях от него. Увеличивайте значение
    на хосте, только если этого требует его фактический интервал активных проверок.
  ? 'No-data window for the agent-liveness heartbeat (agent.variant, 1m). Below it the whole active-check
    channel counts as silent and "VPN: monitoring blind" is suppressed, because whole-host silence belongs
    to the host''s own agent-availability alert, not to this template. MUST stay shorter than {$VPN.WATCHDOG.WINDOW}
    - the parent has to reach PROBLEM before the child would open, and Zabbix dependencies never suppress
    an event that is already open. The 15m default is half the 30m watchdog. Raise both together, never
    one alone.'
  : 'Окно отсутствия данных для контроля доступности агента (agent.variant, 1m). После этого времени весь
    канал активных проверок считается недоступным, а «VPN: нет данных мониторинга» подавляется. За общую
    потерю связи отвечает собственное оповещение хоста о доступности агента. Окно должно быть короче {$VPN.WATCHDOG.WINDOW},
    чтобы родитель успел перейти в PROBLEM до срабатывания дочернего триггера. Зависимости Zabbix не подавляют
    уже открытое событие. Значение по умолчанию 15m вдвое меньше 30m у контроля доставки. Увеличивайте
    оба окна вместе.'
  ? 'Hysteresis window: a trigger only fires if EVERY sample in this window agrees AND at least two samples
    are present (each guarded expression carries an explicit `count(...)>1` floor). The count floor is
    load-bearing, not belt-and-braces: a time window holds a time span, NOT a sample count, so after a
    collection gap longer than the window the window holds exactly one fresh sample and min()/max() would
    fire on that single reading — the very "one bad read pages" failure this macro exists to prevent.
    The watchdog does not cover it either: it keys on wg.count, so a stall in one guarded item while wg.count
    keeps flowing never trips it. Known residual limit (verified on the live server): count() counts VALUES,
    not polls, so on a duplicate-sample host one poll already satisfies >1 — a collection gap longer than
    the window followed by a single duplicate-writing poll can still page off that one poll. That is no
    worse than the pre-1.2.0 count-based form behaved on the same hosts, and it needs both conditions
    at once; closing it would require counting distinct timestamps, which Zabbix trigger functions cannot
    express. Deliberately time-based, not count-based (#N): a host whose agent writes the same value twice
    per poll — proxy-group / dual-ServerActive setups do — makes #2 span a single poll, silently disabling
    the hysteresis. A window cannot be defeated that way. Keep it >2x the longest poll interval among
    the items it guards ({$VPN.PROBE.INTERVAL} and the fixed 10m posture cadence); the 25m default covers
    both. Side effect: the probe-capability canary (wg.probe.ok, 5m) needs the full window too, so a lost
    cap_net_raw is confirmed in ~25m rather than ~10m — still well inside {$VPN.WATCHDOG.WINDOW}.'
  : 'Окно гистерезиса. Триггер срабатывает, только если все значения в окне подтверждают проблему и получено
    не меньше двух значений: каждое защищённое выражение содержит `count(...)>1`. Ограничение числа значений
    необходимо, поскольку окно задаёт время, а не количество записей. После перерыва сбора длиннее окна
    в нём остаётся одно новое значение, и min()/max() без ограничения сработали бы по одному ошибочному
    чтению. Контроль wg.count этого не обнаружит, если остановилась только одна метрика, а wg.count продолжает
    поступать.


    Известное ограничение, проверенное на рабочем сервере: count() считает значения, а не опросы. Если
    хост дублирует записи, один опрос уже удовлетворяет >1. Поэтому после перерыва длиннее окна один опрос
    с дублирующей записью всё ещё может вызвать оповещение. Для этого должны совпасть оба условия; поведение
    не хуже, чем у проверки числа значений до версии 1.2.0 на тех же хостах. Для устранения ограничения
    потребовался бы подсчёт уникальных временных меток, которого нет в функциях триггеров Zabbix.


    Окно задано временем, а не числом записей (#N). При двойной записи значения за опрос, например при
    proxy-group или двух ServerActive, #2 охватывает один опрос и отключает гистерезис. Временное окно
    от дублирования не сокращается. Держите его длиннее удвоенного наибольшего интервала защищённых метрик:
    {$VPN.PROBE.INTERVAL} и фиксированных 10m для конфигурации. Значение по умолчанию 25m покрывает оба
    интервала. Общий контроль проверки wg.probe.ok с интервалом 5m также требует полного окна, поэтому
    потеря cap_net_raw подтверждается примерно за 25m вместо 10m, раньше {$VPN.WATCHDOG.WINDOW}.'
  ? 'Poll interval for the active per-tunnel PMTU probe items (wg.pmtu/vpn.pmtu). Each probe does two
    key-free `wg show` reads via NOPASSWD sudo; an MTU black hole is a config-stable event, so 10m is
    ample and roughly halves the agent''s sudo rate vs the old 5m (host security tooling alerts on service-account
    sudo volume). Lower only if you need faster black-hole detection. RAISING this per host requires raising
    {$VPN.HYST.WINDOW} on the same host to >=2x the new value (>12m30s at the 25m default leaves one sample
    in the window and silently disables the hysteresis — the very defect {$VPN.HYST.WINDOW} exists to
    prevent). No static check can catch that: the test only sees template defaults, never per-host overrides.'
  : 'Интервал активных проверок PMTU отдельных туннелей (wg.pmtu/vpn.pmtu). Каждая проверка дважды читает
    `wg show` через NOPASSWD sudo, не получая ключи. Ошибка MTU определяется устойчивой конфигурацией,
    поэтому интервала 10m достаточно. По сравнению с прежними 5m число вызовов sudo агентом уменьшается
    примерно вдвое; средства безопасности хоста могут оповещать о числе вызовов sudo служебной учётной
    записью. Уменьшайте интервал, если нужно быстрее обнаруживать проблему MTU. При увеличении интервала
    на хосте увеличьте и {$VPN.HYST.WINDOW} на том же хосте как минимум вдвое относительно нового интервала.
    При интервале >12m30s окно 25m оставляет одно значение и отключает гистерезис, от чего защищает {$VPN.HYST.WINDOW}.
    Статическая проверка этого не обнаружит: тест видит значения шаблона по умолчанию, но не переопределения
    на хостах.'
  ? Per-target PMTU no-data window. It must remain longer than {$VPN.WATCHDOG.WINDOW}+{$VPN.PROBE.INTERVAL};
    the 45m default gives the 30m shared delivery watchdog time to become the single parent problem before
    a child probe is declared blind. Offline and ICMP-dark targets keep returning -2/-1 and therefore
    never trip this check. Default nodata mode stays proxy-aware to avoid an event fan-out after proxy
    outages. Raise this macro together with any longer watchdog/probe interval.
  : Окно отсутствия данных PMTU отдельной цели. Оно должно быть длиннее {$VPN.WATCHDOG.WINDOW}+{$VPN.PROBE.INTERVAL}.
    Значение по умолчанию 45m даёт общему контролю доставки с окном 30m время сформировать единственную
    родительскую проблему до события потери данных дочерней проверки. Отключённые цели и цели без ICMP
    продолжают возвращать -2/-1, поэтому этот контроль на них не срабатывает. Режим nodata по умолчанию
    учитывает доступность прокси и предотвращает множество событий после его отказа. Увеличивайте макрос
    вместе с увеличением окна контроля доставки или интервала проверки.
  ? Per-iface probe-target overrides for non-WireGuard tunnels (OpenVPN/ZeroTier). Comma-separated iface=ip
    list, e.g. "ztr4nqvec7=192.168.192.5,tun0=10.8.0.1". Read by the per-tech discovery LLD keys; ifaces
    are unique across techs.
  : Переопределения целей проверки по интерфейсам для туннелей OpenVPN/ZeroTier. Список iface=ip через
    запятую, например "ztr4nqvec7=192.168.192.5,tun0=10.8.0.1". Передаётся в ключи LLD обнаружения соответствующей
    технологии. Имена интерфейсов уникальны между технологиями.
  ? Per-iface probe-target overrides for tunnels with no /32 route (subnet/0.0.0.0/0). Comma-separated
    iface=ip list, e.g. "wg0=192.0.2.3,wgX=10.0.0.1". Passed into the wg.discovery LLD key; an iface with
    neither a /32 route nor an override is left unprobed (no false alert).
  : Переопределения целей проверки по интерфейсам для туннелей без маршрута /32 (подсеть/0.0.0.0/0). Список
    iface=ip через запятую, например "wg0=192.0.2.3,wgX=10.0.0.1". Передаётся в ключ LLD wg.discovery.
    Интерфейс без маршрута /32 и без переопределения остаётся без проверки, чтобы не создавать ложное
    событие.
  'no': нет
  'yes': да
  broken (shared probe unavailable): неисправна (общая проверка недоступна)
  ok: исправна
  offline (no handshake): отключён (нет handshake)
  unreachable (live, no ICMP): недоступен (туннель работает, ICMP не отвечает)
  healthy (no MTU gap): исправен (разницы MTU нет)
