  ? Per-endpoint paging switch resolved by the {#VPN_DYNAMIC} LLD macro. Static/community OpenVPN rows
    use 0 and page; Access Server roaming clients use 1 and remain data-only. Set the contextual value
    back to 1 only when dynamic client PMTU alerts are operationally required.
  : Переключатель оповещений для отдельных целей с контекстом по макросу LLD {#VPN_DYNAMIC}. Статические
    цели OpenVPN Community используют 0 и вызывают оповещения; перемещающиеся клиенты Access Server используют
