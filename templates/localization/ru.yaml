strings:
  VPN Tunnel MTU by Zabbix agent: Мониторинг MTU VPN через агент Zabbix
  ? 'WireGuard/VPN tunnel MTU monitoring. A differential ICMP-DF probe detects silent per-tunnel MTU black
    holes; a handshake gate marks peers with no/stale WireGuard handshake as offline (-2, data-only) so
    roaming/mobile peers do not false-page; plus a config-plane posture check (interface MTU vs {$VPN.MTU.MAX}
    and MSS-clamp presence — pure sysfs/ruleset reads, no probing, so it flags a misconfigured MTU even
    while the tunnel is down and never false-positives on a dead channel), a monitoring-blind watchdog
    (no wg.count data) and a probe-capability canary. The watchdog is narrowed by a second, UserParameter-free
    heartbeat (the built-in agent.variant key): when the whole active-check channel goes silent that heartbeat
    stops first and suppresses the watchdog, so whole-host silence stays with the host''s own agent-availability
    alert and only a genuinely VPN-specific collection failure pages here. Active agent checks; cap_net_raw
    on ping for the probe, a narrow key-free sudoers (wg show allowed-ips/latest-handshakes) for handshake
    age. Probe target = the peer /32 route, overridable per interface via {$WG.PROBE.TARGETS}. Four discovery
    backends: WireGuard/AmneziaWG posture and probe targets, plus OpenVPN and ZeroTier probe targets (the
    probe itself is VPN-agnostic; posture is WireGuard-only on purpose — OpenVPN/ZeroTier use a different
    MTU model, mssfix/fragment ~2800, where a 1420 ceiling would false-positive). The watchdog intentionally
    reuses the backward-compatible wg.count key as a shared Agent2 active-check/UserParameter delivery
    heartbeat on every host installed by installers/install.sh: no wg/awg is a valid numeric 0, while
    no value means this collection path is blind. It does not prove that every backend-specific discovery
    or probe is healthy. Its default nodata mode is proxy-aware, so keep separate Zabbix server/proxy
    availability monitoring.


    Author:  Konstantin Tyutyunnik / Константин Тютюнник

    Site:    https://itforprof.com

    Repo:    https://github.com/IT-for-Prof/zabbix-vpn-monitoring

    License: MIT (c) 2026 Konstantin Tyutyunnik

    '
  : 'Мониторинг MTU туннелей WireGuard/VPN. Дифференциальная проверка ICMP с флагом DF обнаруживает потери
    крупных пакетов из-за MTU в отдельных туннелях. Проверка handshake отмечает узлы WireGuard с отсутствующим
    или устаревшим handshake как отключённые (-2, только данные), чтобы перемещения мобильных клиентов
    не вызывали ложных оповещений. Проверка конфигурации сравнивает MTU интерфейса с {$VPN.MTU.MAX} и
    проверяет наличие ограничения MSS. Она только читает sysfs и правила фильтрации, не отправляет пакеты,
    обнаруживает неверный MTU при отключённом туннеле и не принимает отказ канала за ошибку MTU. Шаблон
    также контролирует поступление wg.count и работоспособность механизма проверки PMTU.


    Дополнительный встроенный ключ agent.variant контролирует канал активных проверок без UserParameter.
    При потере всего канала данные этого ключа перестают поступать раньше, чем срабатывает контроль wg.count,
    и подавляют его. Об общей потере связи с агентом сообщает шаблон доступности агента на хосте; этот
    шаблон оповещает только о сбое сбора данных VPN. Используются активные проверки агента. Для ping требуется
    cap_net_raw, для чтения возраста handshake — узкие правила sudoers на wg show allowed-ips/latest-handshakes,
    не раскрывающие ключи. Цель проверки берётся из маршрута /32 к узлу; для каждого интерфейса её можно
    переопределить через {$WG.PROBE.TARGETS}.


    Четыре правила обнаружения охватывают конфигурацию WireGuard/AmneziaWG и цели проверок WireGuard/AmneziaWG,
    OpenVPN и ZeroTier. Сама проверка не зависит от технологии VPN. Проверка конфигурации применяется
    только к WireGuard: у OpenVPN/ZeroTier другая модель MTU с mssfix/fragment и значениями около 2800,
    где предел 1420 давал бы ложные срабатывания.


    Совместимый с прежними версиями ключ wg.count контролирует общую доставку данных Agent2 через активные
    проверки и UserParameter на всех хостах с мониторингом, установленным через installers/install.sh.
    Если wg/awg отсутствуют, числовой 0 допустим; отсутствие значения означает потерю наблюдения за этим
    каналом сбора. Этот контроль не подтверждает работоспособность каждого отдельного правила обнаружения
    или проверки VPN. Режим nodata по умолчанию учитывает доступность прокси. Доступность Zabbix server/proxy
    нужно контролировать отдельно.


    Author:  Konstantin Tyutyunnik / Константин Тютюнник

    Site:    https://itforprof.com

    Repo:    https://github.com/IT-for-Prof/zabbix-vpn-monitoring

    License: MIT (c) 2026 Konstantin Tyutyunnik

    '
  'VPN monitoring heartbeat: Zabbix agent liveness': 'Контроль мониторинга VPN: доступность агента Zabbix'
  ? 'Built-in agent key (1 = Zabbix agent, 2 = Zabbix agent 2) used as a second, UserParameter-free heartbeat
    on the same active-check channel. It separates the two failures wg.count alone cannot tell apart:
    silent here too means the whole active-check channel is down, which the host''s OS/agent template
    already alerts on; arriving while wg.count does not means this template''s UserParameters are broken,
    which is what the monitoring-blind watchdog is for. Deliberately a native agent key rather than a
    calculated copy of another template''s item: it stays supported on every host that runs an agent (verified
    on FreeBSD/pfSense) and adds no cross-template link requirement. No stock OS template uses this key,
    so it never collides on link.'
  : Встроенный ключ агента (1 = Zabbix agent, 2 = Zabbix agent 2) дополнительно контролирует тот же канал
    активных проверок без UserParameter. Он различает два сбоя, которые wg.count сам не различает. Если
    данные не поступают и здесь, недоступен весь канал активных проверок; об этом уже оповещает шаблон
    ОС/агента на хосте. Если этот ключ поступает, а wg.count отсутствует, сломаны UserParameter этого
    шаблона; для такого случая предусмотрен контроль потери данных VPN. Используется встроенный ключ агента,
    поэтому не нужна вычисляемая копия метрики из другого шаблона или обязательная связь с ним. Ключ поддерживается
    на любом хосте с агентом; это проверено на FreeBSD/pfSense. Штатные шаблоны ОС этот ключ не используют,
    поэтому при привязке конфликтов нет.
  'VPN: host agent silent on {HOST.NAME}': 'VPN: агент не передаёт данные на {HOST.NAME}'
  agent variant={ITEM.LASTVALUE1} (1=agent, 2=agent2): тип агента={ITEM.LASTVALUE1} (1=agent, 2=agent2)
  ? 'The host''s entire active-check channel is silent, not just this template''s UserParameters. Deliberately
    not paged: where an OS or agent template is linked, its own "Zabbix agent is not available" trigger
    owns this alert and a second page would duplicate it. The only job of this trigger is to be the parent
    that suppresses "VPN: monitoring blind", which is why {$VPN.AGENT.WINDOW} must stay shorter than {$VPN.WATCHDOG.WINDOW}.
    A host with no agent-availability template of its own has no owner for this alert - link the stock
    "Zabbix agent active" template there; see docs/DEPLOY-POSTURE.md.'
  : 'Данные не поступают по всему каналу активных проверок хоста, включая UserParameter этого шаблона.
    Отдельное оповещение не предусмотрено: если привязан шаблон ОС или агента, за этот сбой отвечает его
    триггер «Zabbix agent is not available», а повторное уведомление дублировало бы его. Этот триггер
    подавляет «VPN: нет данных мониторинга» как родительская проблема. Поэтому {$VPN.AGENT.WINDOW} должно
    быть короче {$VPN.WATCHDOG.WINDOW}. Если на хосте нет шаблона доступности агента, об этом сбое некому
    оповестить. Привяжите штатный шаблон «Zabbix agent active»; см. docs/DEPLOY-POSTURE.md.'
  'VPN monitoring heartbeat: WireGuard interface count': 'Контроль мониторинга VPN: число интерфейсов
    WireGuard'
  ? Count of WireGuard + AmneziaWG interfaces (the UserParameter unions both). A host without wg/awg returns
    the valid value 0, so this backward-compatible key also serves as a shared Agent2 active-check/UserParameter
    delivery heartbeat. It does not validate backend-specific discovery or probes. Explicit 1m cadence
    keeps nodata({$VPN.WATCHDOG.WINDOW}) independent of global item defaults.
  : Число интерфейсов WireGuard и AmneziaWG; UserParameter объединяет оба списка. Хост без wg/awg возвращает
    допустимое значение 0. Поэтому совместимый с прежними версиями ключ также контролирует общую доставку
    данных Agent2 через активные проверки и UserParameter. Он не проверяет отдельные правила обнаружения
    или проверки VPN. Явный интервал 1m делает nodata({$VPN.WATCHDOG.WINDOW}) независимым от общих настроек
    интервала метрик.
  'VPN: monitoring blind on {HOST.NAME}': 'VPN: нет данных мониторинга на {HOST.NAME}'
  last wg.count={ITEM.LASTVALUE1} (0 is valid): последнее wg.count={ITEM.LASTVALUE1} (0 допустим)
  ? 'No wg.count value for {$VPN.WATCHDOG.WINDOW} while the agent itself is still delivering: this template''s
    Agent2 active-check/UserParameter path is broken. A collected 0 is valid and keeps the delivery heartbeat
    healthy; it does not prove that backend-specific discovery or probes work. Restore shared data delivery
    before investigating dependent tunnel/posture alerts. A silent host is NOT this event: the agent-liveness
    heartbeat goes quiet first and suppresses it, so whole-host silence stays with the owner of that alert.
    Default nodata mode is intentional: it avoids a host-alert storm after a Zabbix proxy outage; monitor
    proxy availability separately.'
  : Значение wg.count не поступает в течение {$VPN.WATCHDOG.WINDOW}, хотя агент продолжает передавать
    данные. Сломан канал активных проверок Agent2/UserParameter этого шаблона. Полученное значение 0 допустимо
    и подтверждает доставку данных, но не работоспособность отдельных правил обнаружения или проверок
    VPN. Восстановите общую доставку данных перед разбором зависимых событий туннелей и конфигурации.
    При общей потере связи с хостом контроль доступности агента срабатывает раньше и подавляет этот триггер;
    за оповещение отвечает шаблон доступности хоста. Режим nodata по умолчанию предотвращает массовые
    события на хостах после отказа Zabbix proxy. Доступность прокси нужно контролировать отдельно.
  'VPN: probe capability': 'VPN: работоспособность проверки PMTU'
  ? 'Shared probe-health canary: 1 if the installed generic/WireGuard PMTU runners and generic UserParameter
    are present and syntactically valid and ping can send a DF packet to loopback; otherwise 0. The backward-compatible
    wg.probe.ok key is retained for existing history and dashboards.'
  : 'Общий контроль механизма проверки PMTU: 1, если универсальный и совместимый с WireGuard скрипты установлены,
    синтаксически корректны, общий UserParameter присутствует и ping отправляет пакет с DF на loopback;
    иначе 0. Совместимый с прежними версиями ключ wg.probe.ok сохранён для существующей истории и дашбордов.'
  Probe capability: Работоспособность проверки PMTU
  'VPN: probe broken on {HOST.NAME}': 'VPN: проверка PMTU не работает на {HOST.NAME}'
  probe canary={ITEM.LASTVALUE1} (1=ok, 0=broken): контроль проверки={ITEM.LASTVALUE1} (1=исправна, 0=сломана)
  ? The shared PMTU runners/UserParameter are missing or invalid, ping cannot send DF packets, or this
    canary alone stopped producing data while the delivery heartbeat remained fresh. Per-tunnel missing-data
    expressions require a healthy canary and therefore close or stay quiet during this failure. The heartbeat
    freshness guard prevents a silent host from being misreported as a probe fault; the monitoring-blind
    watchdog remains the single parent event.
  : Общие скрипты PMTU/UserParameter отсутствуют или некорректны, ping не отправляет пакеты с DF либо
    перестали поступать только данные этого контрольного ключа, а данные контроля доставки остаются свежими.
    Выражения отсутствия данных отдельных туннелей требуют исправного общего механизма проверки, поэтому
    при таком сбое закрывают свои события или не создают их. Проверка свежести общего контроля доставки
    исключает ошибочное сообщение о поломке PMTU при общей потере данных с хоста. Контроль потери данных
    мониторинга остаётся единственным родительским событием.
  WireGuard posture discovery: Обнаружение конфигурации WireGuard
  ? Discovers WireGuard/AmneziaWG interfaces for the config-plane MTU/clamp posture check (no probing).
    OpenVPN/ZeroTier are excluded — their MTU model differs (mssfix/fragment, ~2800).
  : Обнаруживает интерфейсы WireGuard/AmneziaWG для проверки конфигурации MTU и ограничения MSS без отправки
    пакетов. OpenVPN/ZeroTier исключены из-за другой модели MTU (mssfix/fragment, около 2800).
  'WireGuard {#VPN_IFACE}: MTU': 'WireGuard {#VPN_IFACE}: MTU'
  ? 'Configured MTU of the WireGuard interface (config-plane read). No units set on purpose: Zabbix 1024-prefixes
    the "B" unit, so an MTU of 1420 would render as "1.39 KB" — we want the raw 1420. In this estate (WG
    over an internet/Xray underlay) anything >= 1500 silently black-holes large/forwarded traffic — the
    config that caused the proxy config-sync incident.'
  : 'Настроенный MTU интерфейса WireGuard, прочитанный из конфигурации. Единицы намеренно не заданы: Zabbix
    применяет к «B» двоичные приставки, и MTU 1420 отображался бы как «1.39 KB», хотя требуется исходное
    число 1420. В сети, для которой создан шаблон (WG поверх интернета/Xray), значения >= 1500 приводят
    к незаметным потерям крупных и транзитных пакетов. Такая конфигурация вызвала инцидент с синхронизацией
    конфигурации прокси.'
  'WireGuard {#VPN_IFACE}: MTU too high on {HOST.NAME}': 'WireGuard {#VPN_IFACE}: завышен MTU на {HOST.NAME}'
  MTU {ITEM.LASTVALUE1} B (ceiling {$VPN.MTU.MAX}): MTU {ITEM.LASTVALUE1} B (предел {$VPN.MTU.MAX})
  ? 'The WG interface MTU ({ITEM.LASTVALUE}) exceeds the safe ceiling {$VPN.MTU.MAX} for its underlay
    -> large/forwarded packets silently black-hole. Lower the iface MTU (and add an MSS clamp). Config-plane
    check: does not flap, immune to channel-down false positives. Hysteresis over {$VPN.HYST.WINDOW} avoids
    a single bad read — time-based on purpose, since a count-based #2 collapses to one poll on hosts that
    write duplicate samples.'
  : 'MTU интерфейса WG ({ITEM.LASTVALUE}) превышает безопасный для нижележащей сети предел {$VPN.MTU.MAX},
    из-за чего крупные и транзитные пакеты теряются без уведомления. Уменьшите MTU интерфейса и добавьте
    ограничение MSS. Проверка читает конфигурацию, поэтому не меняет состояние при колебаниях доступности
    канала и не принимает его отказ за ошибку MTU. Окно {$VPN.HYST.WINDOW} защищает от одного ошибочного
    чтения. Оно задано временем: проверка последних #2 значений на хостах с дублированием записей охватывала
    бы один опрос.'
  'WireGuard {#VPN_IFACE}: forwards transit': 'WireGuard {#VPN_IFACE}: передаёт транзитный трафик'
  ? 1 if this host forwards transit through the interface (ip_forward/gateway + a routed prefix in allowed-ips/routes),
    else 0. Gates the missing-clamp note so it only evaluates on forwarding gateways.
  : 1, если хост пересылает транзитный трафик через интерфейс (ip_forward/gateway и маршрутизируемый префикс
    в allowed-ips/routes); иначе 0. Ограничивает проверку отсутствия ограничения MSS только шлюзами, которые
    пересылают трафик.
  VPN posture flag: Флаг конфигурации VPN
  'WireGuard {#VPN_IFACE}: MSS clamp present': 'WireGuard {#VPN_IFACE}: настроено ограничение MSS'
  ? 1 if an MSS clamp (pf max-mss / iptables TCPMSS / nft maxseg) covers the interface, else 0. Defense-in-depth
    for forwarded TCP.
  : 1, если ограничение MSS (pf max-mss / iptables TCPMSS / nft maxseg) охватывает интерфейс; иначе 0.
    Это дополнительная защита транзитного TCP.
  'WireGuard {#VPN_IFACE}: forwards transit without MSS clamp on {HOST.NAME}': 'WireGuard {#VPN_IFACE}:
    транзитный трафик без ограничения MSS на {HOST.NAME}'
  forwards={ITEM.LASTVALUE1}, clamp={ITEM.LASTVALUE2}: транзит={ITEM.LASTVALUE1}, ограничение MSS={ITEM.LASTVALUE2}
  ? 'Defense-in-depth gap: a gateway forwarding TCP through this tunnel has no MSS clamp. Harmless while
    the MTU is correct (PMTUD covers it); becomes a silent black hole if the MTU is ever too high or PMTUD
    breaks (asymmetric routing). Information only — not paged. Suppressed when the MTU-too-high warning
    fires on the same iface.'
  : Шлюз пересылает TCP через туннель без дополнительной защиты ограничением MSS. При правильном MTU это
    допустимо, поскольку работает PMTUD. При завышении MTU или отказе PMTUD, например из-за асимметричной
    маршрутизации, возможны незаметные потери пакетов. Событие информационное, без отдельного оповещения.
    Подавляется предупреждением о завышенном MTU на том же интерфейсе.
  OpenVPN probe-target discovery: Обнаружение целей проверки OpenVPN
  'VPN openvpn {#VPN_IFACE}->{#VPN_TARGET}: PMTU gap': 'VPN openvpn {#VPN_IFACE}->{#VPN_TARGET}: разница
    PMTU'
  ? Generic probe (OpenVPN). -2 offline (data-only), -1 live but no ICMP (e.g. an OpenVPN-AS client with
    host firewall — common), 0 healthy, >0 = MTU black-hole gap (bytes). {#VPN_DYNAMIC}=1 marks a roaming
    Access Server client; its data is retained but paging is disabled by {$VPN.DYNAMIC.PAGING:"{#VPN_DYNAMIC}"}.
    Key uses literal 'openvpn' (not {#VPN_TECH}) because Zabbix requires unique prototype keys per template
    and zerotier's rule owns the {#VPN_TECH} form.
  : 'Универсальная проверка для OpenVPN. -2 — туннель отключён, только данные; -1 — туннель работает,
