zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: 55d204abe0194f81b872859ef4d95fb1
      name: Templates/Custom
  templates:
    - uuid: 59d3b052df88477c8c6d8fd14b5f2229
      template: 'VPN Tunnel MTU by Zabbix agent'
      name: 'VPN Tunnel MTU by Zabbix agent'
      description: |
        WireGuard/VPN tunnel MTU monitoring. A differential ICMP-DF probe detects silent per-tunnel MTU black holes; a handshake gate marks peers with no/stale WireGuard handshake as offline (-2, data-only) so roaming/mobile peers do not false-page; plus a config-plane posture check (interface MTU vs {$VPN.MTU.MAX} and MSS-clamp presence — pure sysfs/ruleset reads, no probing, so it flags a misconfigured MTU even while the tunnel is down and never false-positives on a dead channel), a monitoring-blind watchdog (no wg.count data) and a probe-capability canary. Active agent checks; cap_net_raw on ping for the probe, a narrow key-free sudoers (wg show allowed-ips/latest-handshakes) for handshake age. Probe target = the peer /32 route, overridable per interface via {$WG.PROBE.TARGETS}. Four discovery backends: WireGuard/AmneziaWG posture and probe targets, plus OpenVPN and ZeroTier probe targets (the probe itself is VPN-agnostic; posture is WireGuard-only on purpose — OpenVPN/ZeroTier use a different MTU model, mssfix/fragment ~2800, where a 1420 ceiling would false-positive). The watchdog intentionally reuses the backward-compatible wg.count key as a shared Agent2 active-check/UserParameter delivery heartbeat on every host installed by installers/install.sh: no wg/awg is a valid numeric 0, while no value means this collection path is blind. It does not prove that every backend-specific discovery or probe is healthy. Its default nodata mode is proxy-aware, so keep separate Zabbix server/proxy availability monitoring.

        Author:  Konstantin Tyutyunnik / Константин Тютюнник
        Site:    https://itforprof.com
        Repo:    https://github.com/IT-for-Prof/zabbix-vpn-monitoring
        License: MIT (c) 2026 Konstantin Tyutyunnik
      vendor:
        name: itforprof.com
        version: 1.3.0
      groups:
        - name: Templates/Custom
      items:
        - uuid: b09a40f9897b4aaeb9035264f6a53aaa
          name: 'VPN monitoring heartbeat: WireGuard interface count'
          type: ZABBIX_ACTIVE
          key: wg.count
          delay: 1m
          description: 'Count of WireGuard + AmneziaWG interfaces (the UserParameter unions both). A host without wg/awg returns the valid value 0, so this backward-compatible key also serves as a shared Agent2 active-check/UserParameter delivery heartbeat. It does not validate backend-specific discovery or probes. Explicit 1m cadence keeps nodata({$VPN.WATCHDOG.WINDOW}) independent of global item defaults.'
          tags:
            - tag: component
              value: wireguard
          triggers:
            - uuid: 54fba6edb09a407bb9243248bac70f87
              expression: 'nodata(/VPN Tunnel MTU by Zabbix agent/wg.count,{$VPN.WATCHDOG.WINDOW})=1'
              name: 'VPN: monitoring blind on {HOST.NAME}'
              opdata: 'last wg.count={ITEM.LASTVALUE1} (0 is valid)'
              priority: HIGH
              description: 'No wg.count value for {$VPN.WATCHDOG.WINDOW}: delivery through this Agent2 active-check/UserParameter path is broken. A collected 0 is valid and keeps the delivery heartbeat healthy; it does not prove that backend-specific discovery or probes work. Restore shared data delivery before investigating dependent tunnel/posture alerts. Default nodata mode is intentional: it avoids a host-alert storm after a Zabbix proxy outage; monitor proxy availability separately.'
              tags:
                - tag: scope
                  value: availability
        - uuid: 2a2531cc0c8f4a17a392cf59b3715cd5
          name: 'VPN: probe capability'
          type: ZABBIX_ACTIVE
          key: wg.probe.ok
          delay: 5m
          description: 'Shared probe-health canary: 1 if the installed generic/WireGuard PMTU runners and generic UserParameter are present and syntactically valid and ping can send a DF packet to loopback; otherwise 0. The backward-compatible wg.probe.ok key is retained for existing history and dashboards.'
          valuemap:
            name: 'Probe capability'
          tags:
            - tag: component
              value: wireguard
            - tag: scope
              value: probe
          triggers:
            - uuid: ad1b664cf93e4132bfb2a9257d132d6a
              expression: '(nodata(/VPN Tunnel MTU by Zabbix agent/wg.probe.ok,{$VPN.HYST.WINDOW})=1 and nodata(/VPN Tunnel MTU by Zabbix agent/wg.count,{$VPN.PROBE.INTERVAL})=0) or (max(/VPN Tunnel MTU by Zabbix agent/wg.probe.ok,{$VPN.HYST.WINDOW})=0 and count(/VPN Tunnel MTU by Zabbix agent/wg.probe.ok,{$VPN.HYST.WINDOW})>1)'
              name: 'VPN: probe broken on {HOST.NAME}'
              opdata: 'probe canary={ITEM.LASTVALUE1} (1=ok, 0=broken)'
              priority: HIGH
              description: 'The shared PMTU runners/UserParameter are missing or invalid, ping cannot send DF packets, or this canary alone stopped producing data while the delivery heartbeat remained fresh. Per-tunnel missing-data expressions require a healthy canary and therefore close or stay quiet during this failure. The heartbeat freshness guard prevents a silent host from being misreported as a probe fault; the monitoring-blind watchdog remains the single parent event.'
              dependencies:
                - name: 'VPN: monitoring blind on {HOST.NAME}'
                  expression: 'nodata(/VPN Tunnel MTU by Zabbix agent/wg.count,{$VPN.WATCHDOG.WINDOW})=1'
              tags:
                - tag: scope
                  value: probe
      discovery_rules:
        - uuid: 92f719a27a8d43a0b1596513f3b3b418
          name: 'WireGuard posture discovery'
          type: ZABBIX_ACTIVE
          key: vpn.posture.discovery
          delay: 10m
          description: 'Discovers WireGuard/AmneziaWG interfaces for the config-plane MTU/clamp posture check (no probing). OpenVPN/ZeroTier are excluded — their MTU model differs (mssfix/fragment, ~2800).'
          item_prototypes:
            - uuid: 01a59d4bdb9e4a479fd0c679f1dde605
              name: 'WireGuard {#VPN_IFACE}: MTU'
              type: ZABBIX_ACTIVE
              key: 'vpn.posture.mtu[{#VPN_IFACE}]'
              delay: 10m
              value_type: UNSIGNED
              description: 'Configured MTU of the WireGuard interface (config-plane read). No units set on purpose: Zabbix 1024-prefixes the "B" unit, so an MTU of 1420 would render as "1.39 KB" — we want the raw 1420. In this estate (WG over an internet/Xray underlay) anything >= 1500 silently black-holes large/forwarded traffic — the config that caused the proxy config-sync incident.'
              tags:
                - tag: scope
                  value: mtu-posture
                - tag: vpn_iface
                  value: '{#VPN_IFACE}'
              trigger_prototypes:
                - uuid: 3ddb761cdaea445499e4ae57eddf7c29
                  expression: 'min(/VPN Tunnel MTU by Zabbix agent/vpn.posture.mtu[{#VPN_IFACE}],{$VPN.HYST.WINDOW})>{$VPN.MTU.MAX} and count(/VPN Tunnel MTU by Zabbix agent/vpn.posture.mtu[{#VPN_IFACE}],{$VPN.HYST.WINDOW})>1'
                  name: 'WireGuard {#VPN_IFACE}: MTU too high on {HOST.NAME}'
                  opdata: 'MTU {ITEM.LASTVALUE1} B (ceiling {$VPN.MTU.MAX})'
                  priority: WARNING
                  description: 'The WG interface MTU ({ITEM.LASTVALUE}) exceeds the safe ceiling {$VPN.MTU.MAX} for its underlay -> large/forwarded packets silently black-hole. Lower the iface MTU (and add an MSS clamp). Config-plane check: does not flap, immune to channel-down false positives. Hysteresis over {$VPN.HYST.WINDOW} avoids a single bad read — time-based on purpose, since a count-based #2 collapses to one poll on hosts that write duplicate samples.'
                  dependencies:
                    - name: 'VPN: monitoring blind on {HOST.NAME}'
                      expression: 'nodata(/VPN Tunnel MTU by Zabbix agent/wg.count,{$VPN.WATCHDOG.WINDOW})=1'
                  tags:
                    - tag: scope
                      value: mtu-posture
            - uuid: 2c8ba6b0ad1f4f91be765f2e558d7ae8
              name: 'WireGuard {#VPN_IFACE}: forwards transit'
              type: ZABBIX_ACTIVE
              key: 'vpn.posture.fwd[{#VPN_IFACE}]'
              delay: 10m
              value_type: UNSIGNED
              description: '1 if this host forwards transit through the interface (ip_forward/gateway + a routed prefix in allowed-ips/routes), else 0. Gates the missing-clamp note so it only evaluates on forwarding gateways.'
              valuemap:
                name: 'VPN posture flag'
              tags:
                - tag: scope
                  value: mtu-posture
                - tag: vpn_iface
                  value: '{#VPN_IFACE}'
            - uuid: 39538ccad94445b1939d9e59848db64a
              name: 'WireGuard {#VPN_IFACE}: MSS clamp present'
              type: ZABBIX_ACTIVE
              key: 'vpn.posture.clamp[{#VPN_IFACE}]'
              delay: 10m
              value_type: UNSIGNED
              description: '1 if an MSS clamp (pf max-mss / iptables TCPMSS / nft maxseg) covers the interface, else 0. Defense-in-depth for forwarded TCP.'
              valuemap:
                name: 'VPN posture flag'
              tags:
                - tag: scope
                  value: mtu-posture
                - tag: vpn_iface
                  value: '{#VPN_IFACE}'
              trigger_prototypes:
                - uuid: 506da2ec3185425ab44ec378dbbffd3c
                  expression: 'min(/VPN Tunnel MTU by Zabbix agent/vpn.posture.fwd[{#VPN_IFACE}],{$VPN.HYST.WINDOW})=1 and max(/VPN Tunnel MTU by Zabbix agent/vpn.posture.clamp[{#VPN_IFACE}],{$VPN.HYST.WINDOW})=0 and count(/VPN Tunnel MTU by Zabbix agent/vpn.posture.clamp[{#VPN_IFACE}],{$VPN.HYST.WINDOW})>1'
                  name: 'WireGuard {#VPN_IFACE}: forwards transit without MSS clamp on {HOST.NAME}'
                  opdata: 'forwards={ITEM.LASTVALUE1}, clamp={ITEM.LASTVALUE2}'
                  priority: INFO
                  description: 'Defense-in-depth gap: a gateway forwarding TCP through this tunnel has no MSS clamp. Harmless while the MTU is correct (PMTUD covers it); becomes a silent black hole if the MTU is ever too high or PMTUD breaks (asymmetric routing). Information only — not paged. Suppressed when the MTU-too-high warning fires on the same iface.'
                  dependencies:
                    - name: 'WireGuard {#VPN_IFACE}: MTU too high on {HOST.NAME}'
                      expression: 'min(/VPN Tunnel MTU by Zabbix agent/vpn.posture.mtu[{#VPN_IFACE}],{$VPN.HYST.WINDOW})>{$VPN.MTU.MAX} and count(/VPN Tunnel MTU by Zabbix agent/vpn.posture.mtu[{#VPN_IFACE}],{$VPN.HYST.WINDOW})>1'
                    - name: 'VPN: monitoring blind on {HOST.NAME}'
                      expression: 'nodata(/VPN Tunnel MTU by Zabbix agent/wg.count,{$VPN.WATCHDOG.WINDOW})=1'
                  tags:
                    - tag: scope
                      value: mtu-posture
        - uuid: de449ac37e374e9dafc0fca8e32c59b0
          name: 'OpenVPN probe-target discovery'
          type: ZABBIX_ACTIVE
          key: 'openvpn.discovery[{$VPN.PROBE.TARGETS}]'
          delay: 5m
          filter:
            evaltype: AND
            conditions:
              - macro: '{#VPN_TARGET}'
                value: ^.+$
                formulaid: A
          item_prototypes:
            - uuid: aaebad0dc7a045d7af6c5c6416749628
              name: 'VPN openvpn {#VPN_IFACE}->{#VPN_TARGET}: PMTU gap'
              type: ZABBIX_ACTIVE
              key: 'vpn.pmtu[{#VPN_IFACE},{#VPN_TARGET},openvpn]'
              delay: '{$VPN.PROBE.INTERVAL}'
              value_type: FLOAT
              description: 'Generic probe (OpenVPN). -2 offline (data-only), -1 live but no ICMP (e.g. an OpenVPN-AS client with host firewall — common), 0 healthy, >0 = MTU black-hole gap (bytes). Key uses literal ''openvpn'' (not {#VPN_TECH}) because Zabbix requires unique prototype keys per template and zerotier''s rule owns the {#VPN_TECH} form.'
              valuemap:
                name: 'VPN PMTU probe state'
              tags:
                - tag: scope
                  value: mtu
                - tag: vpn_iface
                  value: '{#VPN_IFACE}'
                - tag: vpn_tech
                  value: openvpn
              trigger_prototypes:
                - uuid: 8d102e679715443a8a5737a5f35b3595
                  expression: 'nodata(/VPN Tunnel MTU by Zabbix agent/vpn.pmtu[{#VPN_IFACE},{#VPN_TARGET},openvpn],{$VPN.HYST.WINDOW})=0 and min(/VPN Tunnel MTU by Zabbix agent/vpn.pmtu[{#VPN_IFACE},{#VPN_TARGET},openvpn],{$VPN.HYST.WINDOW})>0 and count(/VPN Tunnel MTU by Zabbix agent/vpn.pmtu[{#VPN_IFACE},{#VPN_TARGET},openvpn],{$VPN.HYST.WINDOW})>1'
                  name: 'VPN openvpn {#VPN_IFACE}->{#VPN_TARGET}: MTU black hole'
                  opdata: 'gap {ITEM.LASTVALUE} B'
                  priority: HIGH
                  description: 'Small packets deliver but at-MTU packets are dropped — lower the tunnel MTU or fix the path. (mssfix only protects TCP; a >0 here means non-TCP/UDP traffic black-holes.)'
                  dependencies:
                    - name: 'VPN: monitoring blind on {HOST.NAME}'
                      expression: 'nodata(/VPN Tunnel MTU by Zabbix agent/wg.count,{$VPN.WATCHDOG.WINDOW})=1'
                  tags:
                    - tag: scope
                      value: mtu
                - uuid: 0bffb7f54e793151347b030b72fadf7d
                  expression: 'nodata(/VPN Tunnel MTU by Zabbix agent/wg.count,{$VPN.WATCHDOG.WINDOW})=0 and nodata(/VPN Tunnel MTU by Zabbix agent/wg.probe.ok,{$VPN.HYST.WINDOW})=0 and max(/VPN Tunnel MTU by Zabbix agent/wg.probe.ok,{$VPN.HYST.WINDOW})=1 and nodata(/VPN Tunnel MTU by Zabbix agent/vpn.pmtu[{#VPN_IFACE},{#VPN_TARGET},openvpn],{$VPN.PROBE.NODATA})=1'
                  name: 'VPN openvpn {#VPN_IFACE}->{#VPN_TARGET}: PMTU data missing on {HOST.NAME}'
                  priority: WARNING
                  description: 'No value from this PMTU item for {$VPN.PROBE.NODATA}. Offline and ICMP-dark targets still return -2/-1, so this reports a blind probe path, not tunnel reachability. The discovery rule disables vanished OpenVPN clients immediately. Inline heartbeat/canary health guards prevent opening during a shared failure and close an already-open event if a shared failure begins later.'
                  tags:
                    - tag: scope
                      value: availability
                - uuid: 026b8482179543538f6585edf856cfef
                  expression: 'max(/VPN Tunnel MTU by Zabbix agent/vpn.pmtu[{#VPN_IFACE},{#VPN_TARGET},openvpn],{$VPN.HYST.WINDOW})=-1 and count(/VPN Tunnel MTU by Zabbix agent/vpn.pmtu[{#VPN_IFACE},{#VPN_TARGET},openvpn],{$VPN.HYST.WINDOW})>1'
                  name: 'VPN openvpn {#VPN_IFACE}->{#VPN_TARGET}: probe target unreachable'
                  status: DISABLED
                  priority: AVERAGE
                  description: 'DATA-ONLY (disabled): a sustained -1 = live tunnel whose target stops answering ICMP. OpenVPN-AS clients are commonly ICMP-dark (host firewall), so this is expected and not paged.'
                  manual_close: 'YES'
                  dependencies:
                    - name: 'VPN: monitoring blind on {HOST.NAME}'
                      expression: 'nodata(/VPN Tunnel MTU by Zabbix agent/wg.count,{$VPN.WATCHDOG.WINDOW})=1'
                    - name: 'VPN: probe broken on {HOST.NAME}'
                      expression: '(nodata(/VPN Tunnel MTU by Zabbix agent/wg.probe.ok,{$VPN.HYST.WINDOW})=1 and nodata(/VPN Tunnel MTU by Zabbix agent/wg.count,{$VPN.PROBE.INTERVAL})=0) or (max(/VPN Tunnel MTU by Zabbix agent/wg.probe.ok,{$VPN.HYST.WINDOW})=0 and count(/VPN Tunnel MTU by Zabbix agent/wg.probe.ok,{$VPN.HYST.WINDOW})>1)'
                  tags:
                    - tag: scope
                      value: liveness
        - uuid: 3e20739bcb64431fb2075503de67c1ff
          name: 'WireGuard probe-target discovery'
          type: ZABBIX_ACTIVE
          key: 'wg.discovery[{$WG.PROBE.TARGETS}]'
          delay: 5m
          filter:
            evaltype: AND
            conditions:
              - macro: '{#WG_TARGET}'
                value: ^.+$
                formulaid: A
          item_prototypes:
            - uuid: 9087dfba84724d59b96678cba382cdee
              name: 'WireGuard {#WG_IFACE}->{#WG_TARGET}: PMTU gap'
              type: ZABBIX_ACTIVE
              key: 'wg.pmtu[{#WG_IFACE},{#WG_TARGET}]'
              delay: '{$VPN.PROBE.INTERVAL}'
              value_type: FLOAT
              description: '-2 offline (no/stale WireGuard handshake; data-only, not paged), -1 live tunnel but no ICMP reply, 0 healthy, >0 = configured MTU minus max-deliverable (black-hole gap, bytes). Carries both wg_iface (historical, kept so existing filters/dashboards keep working) and vpn_iface, the cross-technology tag the posture items and the OpenVPN/ZeroTier probes use — without it no single filter collects everything about one interface. No vpn_tech tag on purpose: wg.discovery unions WireGuard and AmneziaWG (wg_discovery.sh: `wg show interfaces` + `awg show interfaces`), so a literal "wireguard" here would mislabel every awg tunnel.'
              valuemap:
                name: 'VPN PMTU probe state'
              tags:
                - tag: scope
                  value: mtu
                - tag: wg_iface
                  value: '{#WG_IFACE}'
                - tag: vpn_iface
                  value: '{#WG_IFACE}'
              trigger_prototypes:
                - uuid: 440a922390684e5a9e480800df71d792
                  expression: 'nodata(/VPN Tunnel MTU by Zabbix agent/wg.pmtu[{#WG_IFACE},{#WG_TARGET}],{$VPN.HYST.WINDOW})=0 and min(/VPN Tunnel MTU by Zabbix agent/wg.pmtu[{#WG_IFACE},{#WG_TARGET}],{$VPN.HYST.WINDOW})>0 and count(/VPN Tunnel MTU by Zabbix agent/wg.pmtu[{#WG_IFACE},{#WG_TARGET}],{$VPN.HYST.WINDOW})>1'
                  name: 'WireGuard {#WG_IFACE}->{#WG_TARGET}: MTU black hole'
                  opdata: 'gap {ITEM.LASTVALUE} B'
                  priority: HIGH
                  description: 'Small packets deliver but at-MTU packets are dropped — lower tunnel MTU or fix the path.'
                  dependencies:
                    - name: 'VPN: monitoring blind on {HOST.NAME}'
                      expression: 'nodata(/VPN Tunnel MTU by Zabbix agent/wg.count,{$VPN.WATCHDOG.WINDOW})=1'
                  tags:
                    - tag: scope
                      value: mtu
                - uuid: a750b79db23b92e4868a8c570476590c
                  expression: 'nodata(/VPN Tunnel MTU by Zabbix agent/wg.count,{$VPN.WATCHDOG.WINDOW})=0 and nodata(/VPN Tunnel MTU by Zabbix agent/wg.probe.ok,{$VPN.HYST.WINDOW})=0 and max(/VPN Tunnel MTU by Zabbix agent/wg.probe.ok,{$VPN.HYST.WINDOW})=1 and nodata(/VPN Tunnel MTU by Zabbix agent/wg.pmtu[{#WG_IFACE},{#WG_TARGET}],{$VPN.PROBE.NODATA})=1'
                  name: 'WireGuard {#WG_IFACE}->{#WG_TARGET}: PMTU data missing on {HOST.NAME}'
                  priority: WARNING
                  description: 'No value from this PMTU item for {$VPN.PROBE.NODATA}. Offline and ICMP-dark peers still return -2/-1, so this reports a blind probe path, not peer reachability. Inline heartbeat/canary health guards prevent opening during a shared failure and close an already-open event if a shared failure begins later.'
                  tags:
                    - tag: scope
                      value: availability
                - uuid: 41a00e7d6c0a4746888ef6c1f714bc70
                  expression: 'max(/VPN Tunnel MTU by Zabbix agent/wg.pmtu[{#WG_IFACE},{#WG_TARGET}],{$VPN.HYST.WINDOW})=-1 and count(/VPN Tunnel MTU by Zabbix agent/wg.pmtu[{#WG_IFACE},{#WG_TARGET}],{$VPN.HYST.WINDOW})>1'
                  name: 'WireGuard {#WG_IFACE}->{#WG_TARGET}: probe target unreachable'
                  status: DISABLED
                  priority: AVERAGE
                  description: 'DATA-ONLY (disabled): liveness cannot be paged without false positives on roaming/mobile peers. Offline peers report -2 (handshake gate); a sustained -1 means a live tunnel whose target stopped answering ICMP. Re-enable per-peer only with an explicit opt-in gate if precise dead-peer paging is wanted.'
                  manual_close: 'YES'
                  dependencies:
                    - name: 'VPN: monitoring blind on {HOST.NAME}'
                      expression: 'nodata(/VPN Tunnel MTU by Zabbix agent/wg.count,{$VPN.WATCHDOG.WINDOW})=1'
                    - name: 'VPN: probe broken on {HOST.NAME}'
                      expression: '(nodata(/VPN Tunnel MTU by Zabbix agent/wg.probe.ok,{$VPN.HYST.WINDOW})=1 and nodata(/VPN Tunnel MTU by Zabbix agent/wg.count,{$VPN.PROBE.INTERVAL})=0) or (max(/VPN Tunnel MTU by Zabbix agent/wg.probe.ok,{$VPN.HYST.WINDOW})=0 and count(/VPN Tunnel MTU by Zabbix agent/wg.probe.ok,{$VPN.HYST.WINDOW})>1)'
                  tags:
                    - tag: scope
                      value: liveness
        - uuid: 5598806a5ad34db19c14f82b4334d0a8
          name: 'ZeroTier probe-target discovery'
          type: ZABBIX_ACTIVE
          key: 'zerotier.discovery[{$VPN.PROBE.TARGETS}]'
          delay: 5m
          filter:
            evaltype: AND
            conditions:
              - macro: '{#VPN_TARGET}'
                value: ^.+$
                formulaid: A
          item_prototypes:
            - uuid: 0202eeeea9274996b19a1883312908cf
              name: 'VPN {#VPN_TECH} {#VPN_IFACE}->{#VPN_TARGET}: PMTU gap'
              type: ZABBIX_ACTIVE
              key: 'vpn.pmtu[{#VPN_IFACE},{#VPN_TARGET},{#VPN_TECH}]'
              delay: '{$VPN.PROBE.INTERVAL}'
              value_type: FLOAT
              description: 'Generic probe shared by non-WireGuard backends. -2 offline (data-only, not paged), -1 live tunnel but no ICMP reply, 0 healthy, >0 = configured MTU minus max-deliverable (black-hole gap, bytes).'
              valuemap:
                name: 'VPN PMTU probe state'
              tags:
                - tag: scope
                  value: mtu
                - tag: vpn_iface
                  value: '{#VPN_IFACE}'
                - tag: vpn_tech
                  value: '{#VPN_TECH}'
              trigger_prototypes:
                - uuid: 924a12ae1293476691aa656997526cc0
                  expression: 'nodata(/VPN Tunnel MTU by Zabbix agent/vpn.pmtu[{#VPN_IFACE},{#VPN_TARGET},{#VPN_TECH}],{$VPN.HYST.WINDOW})=0 and min(/VPN Tunnel MTU by Zabbix agent/vpn.pmtu[{#VPN_IFACE},{#VPN_TARGET},{#VPN_TECH}],{$VPN.HYST.WINDOW})>0 and count(/VPN Tunnel MTU by Zabbix agent/vpn.pmtu[{#VPN_IFACE},{#VPN_TARGET},{#VPN_TECH}],{$VPN.HYST.WINDOW})>1'
                  name: 'VPN {#VPN_TECH} {#VPN_IFACE}->{#VPN_TARGET}: MTU black hole'
                  opdata: 'gap {ITEM.LASTVALUE} B'
                  priority: HIGH
                  description: 'Small packets deliver but at-MTU packets are dropped — lower the tunnel MTU or fix the path.'
                  dependencies:
                    - name: 'VPN: monitoring blind on {HOST.NAME}'
                      expression: 'nodata(/VPN Tunnel MTU by Zabbix agent/wg.count,{$VPN.WATCHDOG.WINDOW})=1'
                  tags:
                    - tag: scope
                      value: mtu
                - uuid: ab7cc6827767d36dc2f00889f57a66a4
                  expression: 'nodata(/VPN Tunnel MTU by Zabbix agent/wg.count,{$VPN.WATCHDOG.WINDOW})=0 and nodata(/VPN Tunnel MTU by Zabbix agent/wg.probe.ok,{$VPN.HYST.WINDOW})=0 and max(/VPN Tunnel MTU by Zabbix agent/wg.probe.ok,{$VPN.HYST.WINDOW})=1 and nodata(/VPN Tunnel MTU by Zabbix agent/vpn.pmtu[{#VPN_IFACE},{#VPN_TARGET},{#VPN_TECH}],{$VPN.PROBE.NODATA})=1'
                  name: 'VPN {#VPN_TECH} {#VPN_IFACE}->{#VPN_TARGET}: PMTU data missing on {HOST.NAME}'
                  priority: WARNING
                  description: 'No value from this PMTU item for {$VPN.PROBE.NODATA}. Offline and ICMP-dark targets still return -2/-1, so this reports a blind probe path, not tunnel reachability. Inline heartbeat/canary health guards prevent opening during a shared failure and close an already-open event if a shared failure begins later.'
                  tags:
                    - tag: scope
                      value: availability
                - uuid: 3d5cb4811b8b42a3a4b4352bdbe9b082
                  expression: 'max(/VPN Tunnel MTU by Zabbix agent/vpn.pmtu[{#VPN_IFACE},{#VPN_TARGET},{#VPN_TECH}],{$VPN.HYST.WINDOW})=-1 and count(/VPN Tunnel MTU by Zabbix agent/vpn.pmtu[{#VPN_IFACE},{#VPN_TARGET},{#VPN_TECH}],{$VPN.HYST.WINDOW})>1'
                  name: 'VPN {#VPN_TECH} {#VPN_IFACE}->{#VPN_TARGET}: probe target unreachable'
                  status: DISABLED
                  priority: AVERAGE
                  description: 'DATA-ONLY (disabled): liveness is not paged (false positives on roaming peers). Offline reports -2; a sustained -1 means a live tunnel whose target stopped answering ICMP.'
                  manual_close: 'YES'
                  dependencies:
                    - name: 'VPN: monitoring blind on {HOST.NAME}'
                      expression: 'nodata(/VPN Tunnel MTU by Zabbix agent/wg.count,{$VPN.WATCHDOG.WINDOW})=1'
                    - name: 'VPN: probe broken on {HOST.NAME}'
                      expression: '(nodata(/VPN Tunnel MTU by Zabbix agent/wg.probe.ok,{$VPN.HYST.WINDOW})=1 and nodata(/VPN Tunnel MTU by Zabbix agent/wg.count,{$VPN.PROBE.INTERVAL})=0) or (max(/VPN Tunnel MTU by Zabbix agent/wg.probe.ok,{$VPN.HYST.WINDOW})=0 and count(/VPN Tunnel MTU by Zabbix agent/wg.probe.ok,{$VPN.HYST.WINDOW})>1)'
                  tags:
                    - tag: scope
                      value: liveness
      tags:
        - tag: class
          value: network
        - tag: component
          value: wireguard
      macros:
        - macro: '{$VPN.MTU.MAX}'
          value: '1420'
          description: 'Safe MTU ceiling for WireGuard tunnels over an internet/Xray underlay. The posture check pages (Warning) when an iface MTU exceeds this. Override per host/context where a tunnel needs a lower value (e.g. a relay host -> 1340). Sub-ceiling asymmetry (1400 where 1340 is needed) is out of scope — needs cross-host comparison.'
        - macro: '{$VPN.WATCHDOG.WINDOW}'
          value: 30m
          description: 'No-data window for the monitoring-blind watchdog: if the 1m wg.count heartbeat yields nothing for this long, delivery through that Agent2 active-check/UserParameter path is assumed broken and dependent tunnel/posture alerts are suppressed. The value 0 is valid on hosts without wg/awg, so the delivery heartbeat also works on OpenVPN/ZeroTier-only hosts; it is not a healthcheck for their discovery or probe keys. Default nodata mode is proxy-aware; monitor proxy availability separately. Referenced by the watchdog trigger and every dependency on it. Override per host only when its effective active-check cadence requires a longer window.'
        - macro: '{$VPN.HYST.WINDOW}'
          value: 25m
          description: 'Hysteresis window: a trigger only fires if EVERY sample in this window agrees AND at least two samples are present (each guarded expression carries an explicit `count(...)>1` floor). The count floor is load-bearing, not belt-and-braces: a time window holds a time span, NOT a sample count, so after a collection gap longer than the window the window holds exactly one fresh sample and min()/max() would fire on that single reading — the very "one bad read pages" failure this macro exists to prevent. The watchdog does not cover it either: it keys on wg.count, so a stall in one guarded item while wg.count keeps flowing never trips it. Known residual limit (verified on the live server): count() counts VALUES, not polls, so on a duplicate-sample host one poll already satisfies >1 — a collection gap longer than the window followed by a single duplicate-writing poll can still page off that one poll. That is no worse than the pre-1.2.0 count-based form behaved on the same hosts, and it needs both conditions at once; closing it would require counting distinct timestamps, which Zabbix trigger functions cannot express. Deliberately time-based, not count-based (#N): a host whose agent writes the same value twice per poll — proxy-group / dual-ServerActive setups do — makes #2 span a single poll, silently disabling the hysteresis. A window cannot be defeated that way. Keep it >2x the longest poll interval among the items it guards ({$VPN.PROBE.INTERVAL} and the fixed 10m posture cadence); the 25m default covers both. Side effect: the probe-capability canary (wg.probe.ok, 5m) needs the full window too, so a lost cap_net_raw is confirmed in ~25m rather than ~10m — still well inside {$VPN.WATCHDOG.WINDOW}.'
        - macro: '{$VPN.PROBE.INTERVAL}'
          value: 10m
          description: 'Poll interval for the active per-tunnel PMTU probe items (wg.pmtu/vpn.pmtu). Each probe does two key-free `wg show` reads via NOPASSWD sudo; an MTU black hole is a config-stable event, so 10m is ample and roughly halves the agent''s sudo rate vs the old 5m (host security tooling alerts on service-account sudo volume). Lower only if you need faster black-hole detection. RAISING this per host requires raising {$VPN.HYST.WINDOW} on the same host to >=2x the new value (>12m30s at the 25m default leaves one sample in the window and silently disables the hysteresis — the very defect {$VPN.HYST.WINDOW} exists to prevent). No static check can catch that: the test only sees template defaults, never per-host overrides.'
        - macro: '{$VPN.PROBE.NODATA}'
          value: 45m
          description: 'Per-target PMTU no-data window. It must remain longer than {$VPN.WATCHDOG.WINDOW}+{$VPN.PROBE.INTERVAL}; the 45m default gives the 30m shared delivery watchdog time to become the single parent problem before a child probe is declared blind. Offline and ICMP-dark targets keep returning -2/-1 and therefore never trip this check. Default nodata mode stays proxy-aware to avoid an event fan-out after proxy outages. Raise this macro together with any longer watchdog/probe interval.'
        - macro: '{$VPN.PROBE.TARGETS}'
          description: 'Per-iface probe-target overrides for non-WireGuard tunnels (OpenVPN/ZeroTier). Comma-separated iface=ip list, e.g. "ztr4nqvec7=192.168.192.5,tun0=10.8.0.1". Read by the per-tech discovery LLD keys; ifaces are unique across techs.'
        - macro: '{$WG.PROBE.TARGETS}'
          description: 'Per-iface probe-target overrides for tunnels with no /32 route (subnet/0.0.0.0/0). Comma-separated iface=ip list, e.g. "wg0=192.0.2.3,wgX=10.0.0.1". Passed into the wg.discovery LLD key; an iface with neither a /32 route nor an override is left unprobed (no false alert).'
      valuemaps:
        - uuid: 921a5fa7515f4ea59c848da3084c454b
          name: 'VPN posture flag'
          mappings:
            - value: '0'
              newvalue: 'no'
            - value: '1'
              newvalue: 'yes'
        - uuid: c4e2c2161e9840c68a0d657e3830faaa
          name: 'Probe capability'
          mappings:
            - value: '0'
              newvalue: 'broken (shared probe unavailable)'
            - value: '1'
              newvalue: ok
        - uuid: 1053e3fe445d4fa285aff515617cd7d7
          name: 'VPN PMTU probe state'
          mappings:
            - value: '-2'
              newvalue: 'offline (no handshake)'
            - value: '-1'
              newvalue: 'unreachable (live, no ICMP)'
            - value: '0'
              newvalue: 'healthy (no MTU gap)'
