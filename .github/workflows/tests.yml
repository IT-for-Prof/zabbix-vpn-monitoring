name: tests

on:
  push:
    branches: [main]
  pull_request:

# Read-only by default: this job runs repository code as root (the netns rigs need it), so it
# must not also hold a writable token.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # wireguard-tools and the kernel module are what the netns rigs need. Without them they
      # do not fail loudly — they self-skip — but then CI would claim coverage it never had.
      - name: Install test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck python3-yaml wireguard-tools iproute2 iptables
          sudo modprobe wireguard || echo "note: wireguard module unavailable; the netns rigs will SKIP"

      # tools/ is a hand-run diagnostic rig with pre-existing shellcheck warnings (SC1010 on
      # `ping -M do`, plus SC2010/SC2046/SC2193). The production surface below is clean at
      # warning level and must stay that way.
      - name: shellcheck (production surface)
        run: shellcheck -S warning lib/*.sh collectors/*/*.sh installers/*.sh tests/*.sh

      - name: Syntax check every shell file
        run: for f in $(git ls-files '*.sh'); do bash -n "$f"; done

      # Plain `sudo`, not `sudo -E`: preserving the environment needs the SETENV tag, which the
      # runner's sudoers may not grant, and nothing here needs the parent env. The netns rigs
      # mutate host networking, so they require an explicit opt-in rather than inferring consent
      # from uid 0 — a throwaway CI runner is exactly where that opt-in is appropriate.
      - name: Run test suite (privileged — netns rigs included)
        run: sudo ZVM_ALLOW_NETNS=1 bash tests/run-all.sh

      # The unprivileged run is the one that matches production, where the agent is the
      # non-root `zabbix` user and every privileged read goes through `sudo -n`. Running only
      # as root hid a grant/consumer mismatch once already.
      - name: Run test suite (unprivileged — the production path)
        run: bash tests/run-all.sh
