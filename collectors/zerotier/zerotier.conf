# ZeroTier VPN tunnel MTU monitoring — agent2 UserParameters. Scripts in /etc/zabbix/scripts/.
# vpn.pmtu[*] is the SHARED generic probe for every non-WireGuard backend — it must be defined in
# EXACTLY ONE collector conf (this one, as the first non-folding backend). OpenVPN's conf reuses it
# and must NOT redefine it (a duplicate UserParameter key makes the agent refuse to start).
UserParameter=vpn.pmtu[*],/etc/zabbix/scripts/vpn_pmtu.sh "$1" "$2" "$3"
UserParameter=zerotier.discovery[*],/etc/zabbix/scripts/zerotier_discovery.sh "$1"
