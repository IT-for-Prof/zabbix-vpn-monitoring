# VPN tunnel MTU posture — agent2 UserParameters (config-plane, WireGuard/AmneziaWG only).
# Script installed to /etc/zabbix/scripts/ by installers/install.sh. No probing.
# clamp read needs root (iptables-save/nft) -> the script tries sudo -n; without the
# zabbix-posture sudoers it degrades to clamp=0 (Information-only, never a page).
UserParameter=vpn.posture.discovery,/etc/zabbix/scripts/vpn_posture.sh discover
UserParameter=vpn.posture.mtu[*],/etc/zabbix/scripts/vpn_posture.sh mtu "$1"
UserParameter=vpn.posture.fwd[*],/etc/zabbix/scripts/vpn_posture.sh fwd "$1"
UserParameter=vpn.posture.clamp[*],/etc/zabbix/scripts/vpn_posture.sh clamp "$1"
