# WireGuard VPN Exit monitoring — agent2 UserParameters (Phase 1, no privilege).
# Scripts installed to /etc/zabbix/scripts/ by installers/install.sh.
# Count WireGuard + AmneziaWG interfaces (discovery unions both); awg absent = empty,
# so this is identical on wg-only hosts and accurate on awg hosts. Backs the nodata watchdog.
UserParameter=wg.count,( wg show interfaces 2>/dev/null; awg show interfaces 2>/dev/null ) | wc -w
UserParameter=wg.discovery[*],/etc/zabbix/scripts/wg_discovery.sh "$1"
UserParameter=wg.pmtu[*],/etc/zabbix/scripts/wg_pmtu.sh "$1" "$2"
# Shared probe-health canary (backward-compatible key): validate both installed runners and the
# generic UserParameter before checking that ping can send a DF packet (cap_net_raw present).
UserParameter=wg.probe.ok,test -x /etc/zabbix/scripts/wg_pmtu.sh && bash -n /etc/zabbix/scripts/wg_pmtu.sh && test -x /etc/zabbix/scripts/vpn_pmtu.sh && bash -n /etc/zabbix/scripts/vpn_pmtu.sh && grep -Eq '^[[:space:]]*UserParameter=vpn\.pmtu\[\*\],' /etc/zabbix/zabbix_agent2.d/zerotier.conf && ping -M do -s 100 -c1 -W1 127.0.0.1 >/dev/null 2>&1 && echo 1 || echo 0
