# OpenVPN VPN tunnel MTU monitoring — agent2 UserParameter. Scripts in /etc/zabbix/scripts/.
# The shared vpn.pmtu[*] probe is defined in zerotier.conf (the first non-folding backend) — do NOT
# redefine it here (a duplicate UserParameter key makes the agent refuse to start). gate_openvpn.sh
# is dispatched by vpn_pmtu.sh when tech=openvpn.
UserParameter=openvpn.discovery[*],/etc/zabbix/scripts/openvpn_discovery.sh "$1"
